name: Update Macro Monitor & Deploy to GitHub Pages

on:
  schedule:
    # Hari Kerja (Senin-Jumat): Update berkala mengikuti sesi pasar dunia
    # 23:00 UTC = 06:00 WIB (PAGI HARI: Morning Briefing & Transisi Intra-Week Pasca Tutup Wall Street)
    - cron: '0 23 * * 1-5'
    # 00:00 UTC = 07:00 WIB (Pagi hari Asia & persiapan pasar)
    - cron: '0 0 * * 1-5'
    # 02:00 UTC = 09:00 WIB (Pembukaan pasar Asia & IHSG Sesi 1)
    - cron: '0 2 * * 1-5'
    # 04:30 UTC = 11:30 WIB (Rehat siang IHSG)
    - cron: '30 4 * * 1-5'
    # 06:30 UTC = 13:30 WIB (Sesi 2 IHSG & Pembukaan pasar London/Eropa)
    - cron: '30 6 * * 1-5'
    # 09:00 UTC = 16:00 WIB (Penutupan pasar domestik IHSG)
    - cron: '0 9 * * 1-5'
    # 11:30 UTC = 18:30 WIB (Sesi sore Eropa & pre-market Wall Street)
    - cron: '30 11 * * 1-5'
    # 13:30 UTC = 20:30 WIB (Rilis data ekonomi AS: PCE/CPI/NFP/Jobless Claims)
    - cron: '30 13 * * 1-5'
    # 15:30 UTC = 22:30 WIB (Sesi aktif bursa New York Wall Street)
    - cron: '30 15 * * 1-5'
    # 21:00 UTC = 04:00 WIB (Penutupan Wall Street & Rilis Neraca H.4.1 The Fed tiap Kamis)
    - cron: '0 21 * * 1-5'
    # Akhir Pekan (Sabtu-Minggu): Pemantauan pasar Kripto 24/7 tiap 6 jam
    - cron: '0 0,6,12,18 * * 0,6'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual kapan saja dari web/aplikasi HP
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Jakarta'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Macro Pulse Pipeline
        run: |
          python main.py

      - name: Prepare Public Artifacts
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp report_us_macro.html public/report_us_macro.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
