name: Update Macro Monitor & Deploy to GitHub Pages

on:
  schedule:
    # Update otomatis minimal setiap 5 menit (24/7) mengikuti pergerakan harga pasar & kripto
    - cron: '*/5 * * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual kapan saja dari web/GitHub UI
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Jakarta'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Macro Pulse Pipeline
        run: |
          python main.py

      - name: Commit and Push Updated Data & Terminal to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html report_us_macro.html data/
          git diff --staged --quiet || (git commit -m "chore(auto): 5-min live market update [skip ci]" && git push)

      - name: Prepare Public Artifacts
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp report_us_macro.html public/report_us_macro.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
