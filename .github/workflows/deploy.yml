name: Update Macro Monitor & Deploy to GitHub Pages

on:
  schedule:
    # 22:30 UTC = 05:30 WIB (Pasca penutupan bursa Wall Street)
    - cron: '30 22 * * 1-5'
    # 02:00 UTC = 09:00 WIB (Pembukaan pasar Asia / Sesi 1 IHSG)
    - cron: '0 2 * * 1-5'
    # 05:00 UTC = 12:00 WIB (Siang sesi Asia / Pembukaan bursa Eropa)
    - cron: '0 5 * * *'
    # 09:00 UTC = 16:00 WIB (Penutupan pasar domestik IHSG)
    - cron: '0 9 * * 1-5'
    # 13:00 UTC = 20:00 WIB (Jelang pembukaan Wall Street & Rilis PCE/CPI/NFP)
    - cron: '0 13 * * 1-5'
    # 15:30 UTC = 22:30 WIB (Sesi aktif perdagangan New York)
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual kapan saja dari web/aplikasi HP
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Jakarta'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Macro Pulse Pipeline
        run: |
          python main.py

      - name: Prepare Public Artifacts
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp report_us_macro.html public/report_us_macro.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
